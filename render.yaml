services:
  - type: web
    name: drch-backend
    runtime: image
    image:
      url: ghcr.io/siddhcreator-1706/it314_software_project/drch_backend:latest
    plan: free
    region: ohio
    autoDeploy: false

    healthCheckPath: /api/v1/health   # also reports database reachability
    # Names and non-secret values only. Every `sync: false` key is entered in the Render
    # dashboard; see docs/env-variables.md for what each one does.
    envVars:
      # staging keeps every startup secret check but allows the sandbox (mock) donation flow,
      # which APP_ENV=production refuses. Switch to production only with a real gateway.
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: INGEST_TOKEN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # e.g. https://your-app.vercel.app
      - key: FRONTEND_URL
        sync: false          # same Vercel URL; used in invitation and password-reset email links
      - key: AI_TRIAGE_URL
        sync: false          # https://<ai-service>.onrender.com/triage; empty = triage unavailable
      - key: AI_TRIAGE_TOKEN
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false          # same value as NEXT_PUBLIC_GOOGLE_CLIENT_ID on Vercel; empty = Google sign-in off
      - key: SMTP_HOST
        sync: false          # empty = emails are only logged, not sent
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PAYMENT_GATEWAY
        value: mock
      - key: MOCK_GATEWAY_SECRET
        sync: false
      - key: SACHET_FEED_URL
        value: https://sachet.ndma.gov.in/cap_public_website/rss/rss_india.xml
      - key: USGS_FEED_URL
        value: https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&minmagnitude=2.5&minlatitude=20.0&maxlatitude=24.7&minlongitude=68.1&maxlongitude=74.6&orderby=time
      # Live text signals stay off until the team approves live collection (docs/ingestion-sources.md).
      - key: NEWS_RSS_ENABLED
        value: "false"
      - key: BLUESKY_SEARCH_ENABLED
        value: "false"
      - key: INGEST_INTERVAL_SECONDS
        value: "600"
