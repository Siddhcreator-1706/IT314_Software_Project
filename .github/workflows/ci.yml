name: Continuous Integration (CI)

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================================
  # 0. Path Filtering & Secret Scan
  # ============================================================================
  detect-changes:
    name: Changes / Path Filtering
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      ai-workers: ${{ steps.filter.outputs.ai-workers }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Detect modified paths
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - 'scripts/**'
              - 'docs/env-variables.md'
              - 'render.yaml'
              - 'docker-compose*.yml'
              - 'ruff.toml'
              - '.github/workflows/ci.yml'
            ai-workers:
              - 'ai-workers/**'
              - 'docker-compose*.yml'
              - 'ruff.toml'
              - '.github/workflows/ci.yml'

  security-secrets-scan:
    name: Security / GitLeaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 50
      - name: Run Gitleaks secret detection
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # 1. Frontend Quality, Linting & Build (Only if frontend changed)
  # ============================================================================
  frontend-check:
    name: Frontend / Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 22 with npm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Cache Next.js build cache and ESLint cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ./frontend/.next/cache
            ./frontend/.eslintcache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/frontend/package-lock.json') }}-${{ hashFiles('**/frontend/src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/frontend/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Ban demo and mock data markers
        run: bash ../scripts/check_no_demo_data.sh

      - name: Run ESLint
        run: npm run lint -- --cache --cache-location .eslintcache

      - name: Verify Next.js production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Dependency vulnerability audit (High+Critical)
        run: npm audit --audit-level=high

  # ============================================================================
  # 2. Python Backend & AI Workers Quality Scan
  # ============================================================================
  python-check:
    name: Python / Lint, SAST & Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.ai-workers == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            ai-workers/requirements.txt

      - name: Cache Ruff cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ruff_cache
          key: ${{ runner.os }}-ruff-${{ hashFiles('backend/**', 'ai-workers/**') }}
          restore-keys: ${{ runner.os }}-ruff-

      - name: Install code quality and security tools (pinned in requirements-dev.txt)
        run: pip install -r backend/requirements-dev.txt

      - name: Run Ruff linter
        run: ruff check backend/ ai-workers/ --no-fix

      - name: Run Bandit security scan (SAST)
        run: |
          bandit -r backend/ ai-workers/ -ll -ii
          # scripts/ are developer tools: B104 (0.0.0.0 in an allow-list) and B608
          # (SQL built from internal table names) are reviewed false positives there.
          bandit -r scripts/ -ll -ii --skip B104,B608

      - name: Run pip-audit for known CVEs
        run: pip-audit -r backend/requirements.txt -r ai-workers/requirements.txt

  # ============================================================================
  # 2b. AI Workers Test Suite (runs when ai-workers changes, without the database job)
  # ============================================================================
  ai-workers-tests:
    name: AI Workers / Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.ai-workers == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ai-workers/requirements-dev.txt

      - name: Install dependencies
        working-directory: ./ai-workers
        run: pip install -r requirements-dev.txt

      - name: Run AI triage service tests
        working-directory: ./ai-workers
        run: python -m pytest tests -v --tb=short --junitxml=junit-ai-workers.xml

      - name: Upload AI workers test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-workers-test-results
          path: ai-workers/junit-ai-workers.xml
          if-no-files-found: ignore
          retention-days: 14

  # ============================================================================
  # 3. Database Schema, Triggers & Backend Integration Tests (Consolidated Job)
  # ============================================================================
  backend-and-db-tests:
    name: Backend / Migrations, Triggers & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      JWT_SECRET: "ci_pipeline_jwt_secret_token_minimum_32_characters_key"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/drch_test"
      TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/drch_test"
      PGPASSWORD: postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: './backend/requirements.txt'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Apply schema migrations and seeds (same runner as production)
        working-directory: ./backend
        run: python -m app.migrate

      - name: Verify audit log cryptographic hash trigger
        run: |
          psql -h localhost -U postgres -d drch_test -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO audit_logs (action, entity_type, result, rationale)
          VALUES ('CI_VERIFY_TRIGGER', 'system', 'SUCCESS', 'CI pipeline hash chain check');

          DO $$
          DECLARE
            v_hash TEXT;
          BEGIN
            SELECT row_hash INTO v_hash FROM audit_logs WHERE action = 'CI_VERIFY_TRIGGER';
            IF v_hash IS NULL OR length(v_hash) <> 64 THEN
              RAISE EXCEPTION 'Audit hash chain trigger failed: invalid row_hash (got: %)', COALESCE(v_hash, 'NULL');
            END IF;
            RAISE NOTICE 'Audit hash chain verified: %', v_hash;
          END;
          $$;
          SQL
          echo "Cryptographic audit hash chain trigger verified successfully."

      - name: Run test suite with pytest & DB test execution guard
        working-directory: ./backend
        env:
          REQUIRE_DB_TESTS: "1"
        run: |
          python -m pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term --junitxml=junit-backend.xml
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backend test results and coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-results
          path: |
            backend/junit-backend.xml
            backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Environment variable documentation check
        working-directory: .
        run: python scripts/check_env_docs.py

      - name: Execute Core Loop Smoke Test (strict)
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/drch_test"
          JWT_SECRET: "ci_pipeline_jwt_secret_token_minimum_32_characters_key"
          DRCH_STAFF_PASSWORD: "Correct-Horse-Battery-9"
        run: |
          EMAIL="ci-smoke-$RANDOM@test.drch"
          OUT=$(python -m app.cli create-staff --email "$EMAIL" --name "CI Smoke Dispatcher" --permissions DISPATCH,CLOSURE)
          export SMOKE_STAFF_EMAIL="$EMAIL"
          export SMOKE_STAFF_PASSWORD="$DRCH_STAFF_PASSWORD"
          export SMOKE_STAFF_TOTP_SECRET="$(echo "$OUT" | awk '/Secret key/ {print $NF}')"
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:8000/api/v1/health > /dev/null; then break; fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then echo "::error::API server exited before becoming healthy"; exit 1; fi
            if [ "$i" = "30" ]; then echo "::error::API server did not become healthy in 30s"; kill $SERVER_PID || true; exit 1; fi
            sleep 1
          done
          python ../scripts/smoke.py --base-url http://127.0.0.1:8000
          STATUS=$?
          kill $SERVER_PID || true
          exit $STATUS

  # ============================================================================
  # 3b. End-to-End (Playwright): API scenarios against a real backend + the public map page
  # ============================================================================
  e2e:
    name: E2E / Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      JWT_SECRET: "ci_pipeline_jwt_secret_token_minimum_32_characters_key"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/drch_test"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      API_URL: http://127.0.0.1:8000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: './backend/requirements.txt'

      - name: Install backend dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Apply schema migrations and seeds
        working-directory: ./backend
        run: python -m app.migrate

      - name: Start the API
        working-directory: ./backend
        run: |
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:8000/api/v1/health > /dev/null; then echo "API is up."; exit 0; fi
            sleep 1
          done
          echo "::error::API did not become healthy in 30s"; cat "$RUNNER_TEMP/api.log"; exit 1

      - name: Set up Node.js 22 with npm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build and start the frontend (standalone server, as in the container)
        working-directory: ./frontend
        run: |
          npm run build
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          PORT=3000 HOSTNAME=127.0.0.1 nohup node .next/standalone/server.js > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:3000/ > /dev/null; then echo "Frontend is up."; exit 0; fi
            sleep 1
          done
          echo "::error::Frontend did not start in 30s"; cat "$RUNNER_TEMP/web.log"; exit 1

      - name: Install Playwright browser
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: ./frontend
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test --reporter=list,html

      - name: Upload Playwright report and server logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/web.log
          if-no-files-found: ignore
          retention-days: 14

  # ============================================================================
  # 4. Container Build Validation (Matrix on Changed Components Only)
  # ============================================================================
  container-validation:
    name: Container / Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    # Images are built, scanned and published only after every other check passed: the secrets scan,
    # lint/SAST, the test suites and e2e. "Skipped" is fine for components whose paths did not change.
    needs:
      - detect-changes
      - security-secrets-scan
      - frontend-check
      - python-check
      - ai-workers-tests
      - backend-and-db-tests
      - e2e
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.security-secrets-scan.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
            image_name: drch_backend
            build_args: |
              GIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}
            enabled: ${{ needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            image_name: drch_frontend
            build_args: |
              NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
              NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            enabled: ${{ needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
          - name: ai-workers
            context: ./ai-workers
            file: ./ai-workers/Dockerfile
            image_name: drch_ai_workers
            enabled: ${{ needs.detect-changes.outputs.ai-workers == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Check if component should build
        id: check
        run: echo "should_run=${{ matrix.enabled }}" >> $GITHUB_OUTPUT

      - name: Checkout repository
        if: steps.check.outputs.should_run == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        if: steps.check.outputs.should_run == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image with Buildx Layer Cache
        if: steps.check.outputs.should_run == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ matrix.image_name }}:test
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Start image and verify it answers
        if: steps.check.outputs.should_run == 'true'
        run: |
          IMAGE="${{ matrix.image_name }}:test"
          case "${{ matrix.name }}" in
            backend)
              # Needs a database to serve traffic; here, prove the runtime dependencies import.
              docker run --rm "$IMAGE" python -c "import main"
              exit 0 ;;
            ai-workers) PORT_NUM=8001; URL_PATH=/health ;;
            frontend)   PORT_NUM=3000; URL_PATH=/ ;;
          esac
          docker run -d --name ci-smoke -p "$PORT_NUM:$PORT_NUM" "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 "http://127.0.0.1:$PORT_NUM$URL_PATH" > /dev/null; then
              echo "Image answered on port $PORT_NUM."
              docker rm -f ci-smoke > /dev/null
              exit 0
            fi
            sleep 2
          done
          echo "::error::Image did not answer on port $PORT_NUM within 60s."
          docker logs ci-smoke || true
          docker rm -f ci-smoke > /dev/null || true
          exit 1

      - name: Get today's date for the Trivy cache key
        id: trivy_date
        if: steps.check.outputs.should_run == 'true'
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy Vulnerability Database
        if: steps.check.outputs.should_run == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-${{ steps.trivy_date.outputs.day }}
          restore-keys: |
            ${{ runner.os }}-trivy-

      - name: Run Trivy vulnerability scan
        if: steps.check.outputs.should_run == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ matrix.image_name }}:test
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
          cache: true

      # CD promotes this exact image to main instead of rebuilding it (see publish-* in cd.yml).
      # Only after the tests and the scan passed, and only for pull requests from this repository
      # (a fork's token cannot write packages).
      - name: Log in to GHCR
        if: steps.check.outputs.should_run == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the scanned image for promotion
        if: steps.check.outputs.should_run == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          TARGET="ghcr.io/$REPO/${{ matrix.image_name }}:ci-${{ github.event.pull_request.head.sha }}"
          docker tag "${{ matrix.image_name }}:test" "$TARGET"
          docker push "$TARGET"

  # ============================================================================
  # 5a. Vercel Preview (separate from the gate so a Vercel outage cannot fail CI)
  # ============================================================================
  vercel-preview:
    name: Preview / Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes, container-validation]
    # Only when the pull request changes the frontend and every container image built and passed its
    # scan (container-validation itself runs only after all other checks passed). The quality gate runs
    # after this job so its status is the last word, but it never depends on the preview's outcome.
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.frontend == 'true' &&
      needs.container-validation.result == 'success'
    # Reaching Vercel is best effort: a failure here is reported but does not block merging.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository for Vercel deployment
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js for Vercel CLI
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Deploy Verified Preview to Vercel
        id: vercel_deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "⚠️ VERCEL_TOKEN secret is not set (e.g. fork PR). Skipping Vercel preview deployment."
            exit 0
          fi
          echo "Deploying preview to Vercel..."
          DEPLOY_OUTPUT=$(npx --yes vercel@65.15.0 deploy --yes)
          echo "$DEPLOY_OUTPUT"
          PREVIEW_URL=$(echo "$DEPLOY_OUTPUT" | grep -o 'https://[^ ]*vercel\.app' | tail -n 1)
          if [ -z "$PREVIEW_URL" ]; then
            PREVIEW_URL=$(echo "$DEPLOY_OUTPUT" | grep -o 'https://[^ ]*' | tail -n 1)
          fi
          if [ -z "$PREVIEW_URL" ]; then
            echo "::error::Vercel did not return a preview URL."
            exit 1
          fi
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "Vercel preview successfully deployed to: $PREVIEW_URL"
          {
            echo "## 🚀 Vercel Preview"
            echo "[$PREVIEW_URL]($PREVIEW_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment Preview URL on PR
        if: |
          github.event_name == 'pull_request' &&
          steps.vercel_deploy.outputs.url != ''
        continue-on-error: true
        env:
          PREVIEW_URL: ${{ steps.vercel_deploy.outputs.url }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const sha = (context.payload.pull_request ? context.payload.pull_request.head.sha : context.sha).substring(0, 7);
            if (!url) return;
            const prNumber = context.payload.pull_request ? context.payload.pull_request.number : context.issue.number;
            if (!prNumber) return;
            const body = `## 🚀 Vercel Preview\n\n🔗 **Preview URL:** ${url}\n\n_Deployed from commit \`${sha}\` at ${new Date().toISOString()}_`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body && c.body.includes('🚀 Vercel Preview'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  # ============================================================================
  # 5. CI Gatekeeper (Quality Gate)
  # ============================================================================
  ci-gatekeeper:
    name: Pipeline Status / Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs:
      - detect-changes
      - security-secrets-scan
      - frontend-check
      - python-check
      - ai-workers-tests
      - backend-and-db-tests
      - e2e
      - container-validation
      - vercel-preview
    if: always()
    steps:
      # ── Quality Gate (runs LAST with if: always()) ──
      # vercel-preview is listed only so the gate reports after it; its result is informational and is
      # deliberately not evaluated below, so a Vercel problem can never fail or block the required check.
      - name: Evaluate pipeline execution status
        if: always()
        env:
          DETECT: ${{ needs.detect-changes.result }}
          SECRETS_SCAN: ${{ needs.security-secrets-scan.result }}
          FRONTEND: ${{ needs.frontend-check.result }}
          PYTHON: ${{ needs.python-check.result }}
          AI_TESTS: ${{ needs.ai-workers-tests.result }}
          BACKEND: ${{ needs.backend-and-db-tests.result }}
          E2E: ${{ needs.e2e.result }}
          CONTAINER: ${{ needs.container-validation.result }}
          PREVIEW: ${{ needs.vercel-preview.result }}
          CHANGED_FRONTEND: ${{ needs.detect-changes.outputs.frontend }}
          CHANGED_BACKEND: ${{ needs.detect-changes.outputs.backend }}
          CHANGED_AI: ${{ needs.detect-changes.outputs.ai-workers }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "=== CI Job Results ==="
          echo "detect-changes:        $DETECT"
          echo "security-secrets-scan: $SECRETS_SCAN"
          echo "frontend-check:        $FRONTEND"
          echo "python-check:          $PYTHON"
          echo "ai-workers-tests:      $AI_TESTS"
          echo "backend-and-db-tests:  $BACKEND"
          echo "e2e:                   $E2E"
          echo "container-validation:  $CONTAINER"
          echo "vercel-preview (info): $PREVIEW"
          echo "======================"

          FAILED=""

          # Must always succeed. A skipped or failed detect-changes would otherwise
          # skip every job below and let the gate pass with nothing tested.
          require_success() {
            [ "$2" = "success" ] || FAILED="$FAILED $1($2)"
          }
          # Must succeed when the matching paths changed (or on a manual run);
          # may be skipped otherwise.
          require_if_changed() {
            if [ "$3" = "true" ] || [ "$EVENT" = "workflow_dispatch" ]; then
              [ "$2" = "success" ] || FAILED="$FAILED $1($2)"
            else
              case "$2" in success|skipped) ;; *) FAILED="$FAILED $1($2)" ;; esac
            fi
          }

          E2E_CHANGED=false
          if [ "$CHANGED_FRONTEND" = "true" ] || [ "$CHANGED_BACKEND" = "true" ]; then E2E_CHANGED=true; fi
          PY_CHANGED=false
          if [ "$CHANGED_BACKEND" = "true" ] || [ "$CHANGED_AI" = "true" ]; then PY_CHANGED=true; fi

          require_success detect-changes "$DETECT"
          require_success security-secrets-scan "$SECRETS_SCAN"
          require_if_changed frontend-check "$FRONTEND" "$CHANGED_FRONTEND"
          require_if_changed python-check "$PYTHON" "$PY_CHANGED"
          require_if_changed ai-workers-tests "$AI_TESTS" "$CHANGED_AI"
          require_if_changed backend-and-db-tests "$BACKEND" "$CHANGED_BACKEND"
          require_if_changed e2e "$E2E" "$E2E_CHANGED"
          require_success container-validation "$CONTAINER"

          if [ -n "$FAILED" ]; then
            echo "::error::CI quality gate FAILED. Jobs that did not succeed:$FAILED"
            exit 1
          fi
          echo "CI quality gate PASSED: every required job succeeded."
