name: DRCH Enterprise CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1

jobs:
  # ============================================================================
  # 1. Static Application Security Testing (SAST) & Code Quality
  # ============================================================================
  code-security-and-lint:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (Frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Setup Python (Backend/AI)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Frontend Linting
      - name: Install Frontend Deps
        run: cd frontend && npm ci
      - name: ESLint Check
        run: cd frontend && npm run lint

      # Python Linting & Security (Bandit)
      - name: Install Python Tools
        run: pip install flake8 bandit black
      - name: Python Formatting Check (Black)
        run: black --check backend/ ai-workers/ || echo "Formatting issues found"
      - name: Python Linting (Flake8)
        run: flake8 backend/ ai-workers/ --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Python SAST Security Scan (Bandit)
        run: bandit -r backend/ ai-workers/ -ll -ii

  # ============================================================================
  # 2. Database Schema & Seed Data Validation
  #    Spins up a real PostGIS container, applies drch_schema.sql + seed_data.sql,
  #    and verifies all tables, views, triggers, indexes, and seed rows exist.
  # ============================================================================
  database-validation:
    name: Database Schema & Seed Validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drch_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for postgres..."
            sleep 2
          done

      # -----------------------------------------------------------
      # Apply Schema (DDL)
      # -----------------------------------------------------------
      - name: Apply Schema (drch_schema.sql)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d drch_test_db \
            -f backend/drch_schema.sql \
            -v ON_ERROR_STOP=1
        env:
          PGPASSWORD: postgres

      # -----------------------------------------------------------
      # Apply Seed Data
      # -----------------------------------------------------------
      - name: Apply Seed Data (seed_data.sql)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d drch_test_db \
            -f backend/seed_data.sql \
            -v ON_ERROR_STOP=1
        env:
          PGPASSWORD: postgres

      # -----------------------------------------------------------
      # Validate: Core Tables Exist
      # -----------------------------------------------------------
      - name: Validate Core Tables
        run: |
          EXPECTED_TABLES=(
            "roles"
            "agencies"
            "users"
            "user_auth"
            "incidents"
            "incident_status_history"
            "evidence_files"
            "ai_recommendations"
            "resources"
            "dispatch_orders"
            "resource_assignments"
            "agency_messages"
            "public_updates"
            "donation_campaigns"
            "donations"
            "aid_needs"
            "aid_contributions"
            "notifications"
            "system_configs"
            "audit_logs"
          )
          MISSING=0
          for table in "${EXPECTED_TABLES[@]}"; do
            EXISTS=$(PGPASSWORD=postgres psql -h localhost -U postgres -d drch_test_db -tAc \
              "SELECT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='$table');")
            if [ "$EXISTS" != "t" ]; then
              echo "❌ MISSING TABLE: $table"
              MISSING=$((MISSING + 1))
            else
              echo "✅ Table exists: $table"
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "::error::$MISSING core table(s) are missing from the schema!"
            exit 1
          fi
          echo "All 20 core tables validated successfully."
        env:
          PGPASSWORD: postgres

      # -----------------------------------------------------------
      # Validate: Views Exist
      # -----------------------------------------------------------
      - name: Validate Views
        run: |
          EXPECTED_VIEWS=(
            "v_incident_summary"
            "v_incident_dashboard"
            "v_resource_availability"
            "v_donation_summary"
            "v_aid_summary"
            "v_dispatch_summary"
          )
          MISSING=0
          for view in "${EXPECTED_VIEWS[@]}"; do
            EXISTS=$(PGPASSWORD=postgres psql -h localhost -U postgres -d drch_test_db -tAc \
              "SELECT EXISTS (SELECT 1 FROM information_schema.views WHERE table_schema='public' AND table_name='$view');")
            if [ "$EXISTS" != "t" ]; then
              echo "❌ MISSING VIEW: $view"
              MISSING=$((MISSING + 1))
            else
              echo "✅ View exists: $view"
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "::error::$MISSING view(s) are missing from the schema!"
            exit 1
          fi
        env:
          PGPASSWORD: postgres

      # -----------------------------------------------------------
      # Validate: Critical Triggers Exist
      # -----------------------------------------------------------
      - name: Validate Triggers
        run: |
          EXPECTED_TRIGGERS=(
            "trg_audit_hash_chain"
            "trg_users_upd"
            "trg_user_auth_upd"
            "trg_incidents_upd"
            "trg_resources_upd"
            "trg_incidents_sync_geom"
          )
          MISSING=0
          for trigger in "${EXPECTED_TRIGGERS[@]}"; do
            EXISTS=$(PGPASSWORD=postgres psql -h localhost -U postgres -d drch_test_db -tAc \
              "SELECT EXISTS (SELECT 1 FROM information_schema.triggers WHERE trigger_schema='public' AND trigger_name='$trigger');")
            if [ "$EXISTS" != "t" ]; then
              echo "❌ MISSING TRIGGER: $trigger"
              MISSING=$((MISSING + 1))
            else
              echo "✅ Trigger exists: $trigger"
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "::error::$MISSING trigger(s) are missing!"
            exit 1
          fi
        env:
          PGPASSWORD: postgres

      # -----------------------------------------------------------
      # Validate: Extensions Loaded
      # -----------------------------------------------------------
      - name: Validate Extensions (PostGIS, pgcrypto, citext)
        run: |
          for ext in pgcrypto postgis citext; do
            EXISTS=$(PGPASSWORD=postgres psql -h localhost -U postgres -d drch_test_db -tAc \
              "SELECT EXISTS (SELECT 1 FROM pg_extension WHERE extname='$ext');")
            if [ "$EXISTS" != "t" ]; then
              echo "::error::Extension $ext is not installed!"
              exit 1
            fi
            echo "✅ Extension loaded: $ext"
          done
        env:
          PGPASSWORD: postgres

      # -----------------------------------------------------------
      # Validate: Seed Data Rows
      # -----------------------------------------------------------
      - name: Validate Seed Data
        run: |
          echo "--- Checking roles ---"
          ROLE_COUNT=$(PGPASSWORD=postgres psql -h localhost -U postgres -d drch_test_db -tAc \
            "SELECT COUNT(*) FROM roles;")
          echo "  Roles seeded: $ROLE_COUNT"
          if [ "$ROLE_COUNT" -lt 3 ]; then
            echo "::error::Expected 3 roles (NORMAL_USER, DISASTER_MGMT, APP_MGMT), found $ROLE_COUNT"
            exit 1
          fi

          echo "--- Checking agencies ---"
          AGENCY_COUNT=$(PGPASSWORD=postgres psql -h localhost -U postgres -d drch_test_db -tAc \
            "SELECT COUNT(*) FROM agencies;")
          echo "  Agencies seeded: $AGENCY_COUNT"
          if [ "$AGENCY_COUNT" -lt 1 ]; then
            echo "::error::No agencies were seeded!"
            exit 1
          fi

          echo "--- Checking bootstrap admin user & auth ---"
          ADMIN_EXISTS=$(PGPASSWORD=postgres psql -h localhost -U postgres -d drch_test_db -tAc \
            "SELECT EXISTS (SELECT 1 FROM users u JOIN user_auth a ON u.user_id = a.user_id WHERE u.email='admin@drch.gov.in');")
          if [ "$ADMIN_EXISTS" != "t" ]; then
            echo "::error::Bootstrap admin user or user_auth was not seeded!"
            exit 1
          fi
          echo "  ✅ Bootstrap admin & credentials exist"

          echo ""
          echo "✅ All seed data validated successfully."
        env:
          PGPASSWORD: postgres

      # -----------------------------------------------------------
      # Validate: Audit Hash Chain Trigger (NFR: Tamper-evident log)
      # -----------------------------------------------------------
      - name: Validate Audit Hash Chain Integrity
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d drch_test_db -v ON_ERROR_STOP=1 <<'SQL'
          -- Insert a test audit log entry and verify hash chain fires
          INSERT INTO audit_logs (actor_id, action, entity_type, entity_id, result, rationale)
          VALUES (
            (SELECT user_id FROM users WHERE email='admin@drch.gov.in'),
            'CI_TEST_ACTION',
            'system',
            NULL,
            'SUCCESS',
            'CI pipeline hash chain verification'
          );

          -- Verify the row_hash was computed (not NULL or empty)
          DO $$
          DECLARE
            v_hash TEXT;
            v_prev TEXT;
          BEGIN
            SELECT row_hash, prev_hash INTO v_hash, v_prev
            FROM audit_logs
            WHERE action = 'CI_TEST_ACTION'
            ORDER BY audit_id DESC LIMIT 1;

            IF v_hash IS NULL OR v_hash = '' THEN
              RAISE EXCEPTION 'Audit hash chain FAILED: row_hash is NULL or empty';
            END IF;

            IF v_prev IS NULL OR v_prev = '' THEN
              RAISE EXCEPTION 'Audit hash chain FAILED: prev_hash is NULL or empty';
            END IF;

            RAISE NOTICE 'Audit hash chain OK — row_hash=% prev_hash=%', v_hash, v_prev;
          END;
          $$;

          -- Cleanup
          DELETE FROM audit_logs WHERE action = 'CI_TEST_ACTION';
          SQL
          echo "✅ Audit hash chain trigger is functional."
        env:
          PGPASSWORD: postgres

      # -----------------------------------------------------------
      # Validate: Idempotency (re-run seed_data.sql without errors)
      # -----------------------------------------------------------
      - name: Validate Seed Idempotency (re-run seed_data.sql)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d drch_test_db \
            -f backend/seed_data.sql \
            -v ON_ERROR_STOP=1
          echo "✅ Seed data is idempotent (second run succeeded without errors)."
        env:
          PGPASSWORD: postgres

  # ============================================================================
  # 3. Backend Unit Tests
  # ============================================================================
  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: code-security-and-lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run Backend Tests
        run: |
          cd backend
          if [ -d "tests" ] && [ "$(find tests -name 'test_*.py' | head -1)" ]; then
            python -m pytest tests/ -v --tb=short
          else
            echo "⚠️  No test suite found in backend/tests/ — running smoke test"
            python -c "from main import app; print('✅ FastAPI app imports successfully')"
          fi

  # ============================================================================
  # 4. Build Verification (Frontend)
  # ============================================================================
  frontend-build:
    name: Next.js Production Build
    runs-on: ubuntu-latest
    needs: code-security-and-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: cd frontend && npm ci

      - name: Build Next.js
        run: cd frontend && npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # ============================================================================
  # 5. Docker Container Build & Image Vulnerability Scan
  # ============================================================================
  docker-infrastructure:
    name: Container Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: [code-security-and-lint, database-validation]
    steps:
      - uses: actions/checkout@v4

      # Build all images using Docker Compose
      - name: Build Docker Compose Stack
        run: docker compose build --parallel

      # Install Trivy for Container Security Scanning
      - name: Install Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'drch_backend:latest'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'drch_frontend:latest'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Scan AI Workers Image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'drch_ai_workers:latest'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
