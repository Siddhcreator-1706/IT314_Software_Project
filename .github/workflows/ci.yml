name: DRCH Enterprise CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1

jobs:
  # ============================================================================
  # 1. Static Application Security Testing (SAST) & Code Quality
  # ============================================================================
  code-security-and-lint:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (Frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Setup Python (Backend/AI)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Frontend Linting
      - name: Install Frontend Deps
        run: cd frontend && npm ci
      - name: ESLint Check
        run: cd frontend && npm run lint

      # Python Linting & Security (Bandit)
      - name: Install Python Tools
        run: pip install flake8 bandit black
      - name: Python Formatting Check (Black)
        run: black --check backend/ ai-workers/ || echo "Formatting issues found"
      - name: Python Linting (Flake8)
        run: flake8 backend/ ai-workers/ --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Python SAST Security Scan (Bandit)
        run: bandit -r backend/ ai-workers/ -ll -ii

  # ============================================================================
  # 2. Database Schema Validation (DDL & Triggers Integrity)
  #    Compiles and validates drch_schema.sql against real PostgreSQL 16 + PostGIS.
  #    Ensures DDL syntax, constraints, extensions, views and triggers are 100% valid.
  #    Decoupled from seed data so builds remain fast and resilient.
  # ============================================================================
  database-schema-validation:
    name: Database Schema & Trigger Validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drch_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Compile and Apply DDL Schema (drch_schema.sql)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d drch_test_db \
            -f backend/drch_schema.sql \
            -v ON_ERROR_STOP=1
          echo "✅ Database schema compiled successfully with zero DDL or constraint errors."
        env:
          PGPASSWORD: postgres

      - name: Verify Tamper-Evident Hash Chain Trigger (AM-FR-05)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d drch_test_db -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO audit_logs (action, entity_type, result, rationale)
          VALUES ('CI_VERIFY_TRIGGER', 'system', 'SUCCESS', 'CI pipeline hash chain check');

          DO $$
          DECLARE
            v_hash TEXT;
          BEGIN
            SELECT row_hash INTO v_hash FROM audit_logs WHERE action = 'CI_VERIFY_TRIGGER';
            IF v_hash IS NULL OR length(v_hash) <> 64 THEN
              RAISE EXCEPTION 'Audit hash chain trigger failed: invalid row_hash';
            END IF;
          END;
          $$;
          SQL
          echo "✅ Cryptographic audit hash chain trigger verified successfully."
        env:
          PGPASSWORD: postgres

  # ============================================================================
  # 3. Backend Unit Tests
  # ============================================================================
  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: code-security-and-lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run Backend Tests
        run: |
          cd backend
          if [ -d "tests" ] && [ "$(find tests -name 'test_*.py' | head -1)" ]; then
            python -m pytest tests/ -v --tb=short
          else
            echo "⚠️  No test suite found in backend/tests/ — running smoke test"
            python -c "from main import app; print('✅ FastAPI app imports successfully')"
          fi

  # ============================================================================
  # 4. Build Verification (Frontend)
  # ============================================================================
  frontend-build:
    name: Next.js Production Build
    runs-on: ubuntu-latest
    needs: code-security-and-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: cd frontend && npm ci

      - name: Build Next.js
        run: cd frontend && npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # ============================================================================
  # 5. Docker Container Build & Image Vulnerability Scan
  # ============================================================================
  docker-infrastructure:
    name: Container Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: [code-security-and-lint, database-schema-validation]
    steps:
      - uses: actions/checkout@v4

      # Build all images using Docker Compose
      - name: Build Docker Compose Stack
        run: docker compose build --parallel

      # Install Trivy for Container Security Scanning
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'drch_frontend:latest'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Scan AI Workers Image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'drch_ai_workers:latest'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
