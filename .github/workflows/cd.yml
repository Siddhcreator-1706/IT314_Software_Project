name: Continuous Deployment (CD)

on:
  push:
    branches: [ "main" ]
    # S3-12 / S3-18: a release tag (vX.Y.Z or vX.Y.Z-rcN) builds every image from that exact commit and
    # tags it with the version, so a release can be deployed and rolled back by version. Tag builds do
    # not deploy and do not move `latest`; the release is deployed by pointing Render at the version
    # tag (docs/release-runbook.md section 4).
    tags: [ "v*.*.*" ]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  # Only the newest push to main deploys; older queued/running runs are cancelled.
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKER_BUILDKIT: 1

jobs:
  # ============================================================================
  # 0. Detect Changed Directories
  # ============================================================================
  detect-changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      backend: ${{ steps.detect.outputs.backend }}
      ai-workers: ${{ steps.detect.outputs.ai-workers }}
    steps:
      # Ref guard: only main and release tags may build or deploy. The "main" ruleset (PR + strict
      # Quality Gate check) already ensures code reaching main passed CI; it does not cover manual
      # runs from other branches or release tags, so check here. Every later job needs this job.
      - name: Only main and release tags may run CD
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ] && [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::CD runs only from main or a release tag (got $GITHUB_REF)."
            exit 1
          fi

      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release tag must be on main
        if: ${{ github.ref_type == 'tag' }}
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main."
            exit 1
          fi

      # A newer push cancels an older CD run, and a run can also fail. Comparing each commit
      # only with its parent would then lose the older run's changes, so compare with the
      # commit of the last CD run that succeeded. Anything since then is built and deployed.
      - name: Detect changed components
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set_all() {
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "ai-workers=true" >> "$GITHUB_OUTPUT"
          }

          # Release tags build every image; there is no base commit to compare with.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            set_all
            exit 0
          fi

          BASE=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cd.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || true)

          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "::notice::No earlier successful CD run found; treating every component as changed."
            set_all
            exit 0
          fi

          echo "Comparing $GITHUB_SHA with last successful CD run $BASE"
          CHANGED=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          echo "Changed files:"; echo "$CHANGED"

          check() {  # $1 = output name, $2 = extended regex of paths that affect it
            if echo "$CHANGED" | grep -Eq "$2"; then echo "$1=true" >> "$GITHUB_OUTPUT"; else echo "$1=false" >> "$GITHUB_OUTPUT"; fi
          }
          COMMON='docker-compose[^/]*\.yml$|\.github/workflows/cd\.yml$'
          check frontend   "^(frontend/|$COMMON)"
          check backend    "^(backend/|scripts/|render\.yaml$|$COMMON)"
          check ai-workers "^(ai-workers/|$COMMON)"

  # ============================================================================
  # 1. Build and Publish Frontend Container to GHCR (Only if frontend changed)
  # ============================================================================
  publish-frontend:
    name: Publish Container / Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' }}
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # CI already built, tested and scanned this code in the pull request. When the merged tree is
      # identical to the PR head, retag that exact image instead of rebuilding it; otherwise (direct
      # push, differing tree, no CI image) fall back to building from source below.
      - name: Promote the CI-built image when it matches this commit
        id: promote
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "done=false" >> "$GITHUB_OUTPUT"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/drch_frontend"
          PR_HEAD=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.base.ref == "main" and .merged_at != null)][0].head.sha // empty' 2>/dev/null || true)
          if [ -z "$PR_HEAD" ]; then
            echo "No merged pull request found for this commit; building from source."; exit 0
          fi
          TREE_NOW=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.tree.sha)
          TREE_PR=$(gh api "repos/$GITHUB_REPOSITORY/commits/$PR_HEAD" --jq .commit.tree.sha)
          if [ "$TREE_NOW" != "$TREE_PR" ]; then
            echo "Merged tree differs from the pull request head; building from source."; exit 0
          fi
          if docker buildx imagetools create -t "$IMAGE:latest" -t "$IMAGE:sha-${GITHUB_SHA:0:7}" "$IMAGE:ci-$PR_HEAD"; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "version=$PR_HEAD" >> "$GITHUB_OUTPUT"
            echo "Promoted $IMAGE:ci-$PR_HEAD to latest and sha-${GITHUB_SHA:0:7}."
          else
            echo "No CI image $IMAGE:ci-$PR_HEAD found; building from source."
          fi

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/drch_frontend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      - name: Build and push verified container to GHCR
        if: ${{ steps.promote.outputs.done != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ============================================================================
  # 2. Build and Publish Backend Container to GHCR (Only if backend changed)
  # ============================================================================
  publish-backend:
    name: Publish Container / Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' }}
    permissions:
      contents: read
      packages: write
      pull-requests: read
    outputs:
      version: ${{ steps.promote.outputs.version || github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # CI already built, tested and scanned this code in the pull request. When the merged tree is
      # identical to the PR head, retag that exact image instead of rebuilding it; otherwise (direct
      # push, differing tree, no CI image) fall back to building from source below.
      - name: Promote the CI-built image when it matches this commit
        id: promote
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "done=false" >> "$GITHUB_OUTPUT"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/drch_backend"
          PR_HEAD=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.base.ref == "main" and .merged_at != null)][0].head.sha // empty' 2>/dev/null || true)
          if [ -z "$PR_HEAD" ]; then
            echo "No merged pull request found for this commit; building from source."; exit 0
          fi
          TREE_NOW=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.tree.sha)
          TREE_PR=$(gh api "repos/$GITHUB_REPOSITORY/commits/$PR_HEAD" --jq .commit.tree.sha)
          if [ "$TREE_NOW" != "$TREE_PR" ]; then
            echo "Merged tree differs from the pull request head; building from source."; exit 0
          fi
          if docker buildx imagetools create -t "$IMAGE:latest" -t "$IMAGE:sha-${GITHUB_SHA:0:7}" "$IMAGE:ci-$PR_HEAD"; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "version=$PR_HEAD" >> "$GITHUB_OUTPUT"
            echo "Promoted $IMAGE:ci-$PR_HEAD to latest and sha-${GITHUB_SHA:0:7}."
          else
            echo "No CI image $IMAGE:ci-$PR_HEAD found; building from source."
          fi

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/drch_backend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      - name: Build and push verified container to GHCR
        if: ${{ steps.promote.outputs.done != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ============================================================================
  # 3. Build and Publish AI Workers Container to GHCR (Only if ai-workers changed)
  # ============================================================================
  publish-ai-workers:
    name: Publish Container / AI Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.ai-workers == 'true' || github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' }}
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # CI already built, tested and scanned this code in the pull request. When the merged tree is
      # identical to the PR head, retag that exact image instead of rebuilding it; otherwise (direct
      # push, differing tree, no CI image) fall back to building from source below.
      - name: Promote the CI-built image when it matches this commit
        id: promote
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "done=false" >> "$GITHUB_OUTPUT"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/drch_ai_workers"
          PR_HEAD=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.base.ref == "main" and .merged_at != null)][0].head.sha // empty' 2>/dev/null || true)
          if [ -z "$PR_HEAD" ]; then
            echo "No merged pull request found for this commit; building from source."; exit 0
          fi
          TREE_NOW=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.tree.sha)
          TREE_PR=$(gh api "repos/$GITHUB_REPOSITORY/commits/$PR_HEAD" --jq .commit.tree.sha)
          if [ "$TREE_NOW" != "$TREE_PR" ]; then
            echo "Merged tree differs from the pull request head; building from source."; exit 0
          fi
          if docker buildx imagetools create -t "$IMAGE:latest" -t "$IMAGE:sha-${GITHUB_SHA:0:7}" "$IMAGE:ci-$PR_HEAD"; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "version=$PR_HEAD" >> "$GITHUB_OUTPUT"
            echo "Promoted $IMAGE:ci-$PR_HEAD to latest and sha-${GITHUB_SHA:0:7}."
          else
            echo "No CI image $IMAGE:ci-$PR_HEAD found; building from source."
          fi

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/drch_ai_workers
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      - name: Build and push verified container to GHCR
        if: ${{ steps.promote.outputs.done != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: ./ai-workers
          file: ./ai-workers/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ai-workers
          cache-to: type=gha,mode=max,scope=ai-workers

  # ============================================================================
  # 3b. Staging: deploy the commit's backend image, then smoke-test it.
  #     Production deploys only after this passes (or when staging is not configured).
  # ============================================================================
  check-staging:
    name: Check Staging Config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [publish-backend]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.publish-backend.result == 'success'
    environment:
      name: staging
    outputs:
      configured: ${{ steps.cfg.outputs.configured }}
    steps:
      - name: Detect staging secrets
        id: cfg
        env:
          STAGING_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
          STAGING_URL: ${{ secrets.STAGING_BACKEND_URL }}
        run: |
          if [ -n "$STAGING_HOOK" ] && [ -n "$STAGING_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RENDER_STAGING_DEPLOY_HOOK or STAGING_BACKEND_URL not set. Staging deploy and smoke will be skipped."
          fi

  deploy-staging:
    name: Deploy Backend / Staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check-staging]
    if: |
      always() &&
      needs.check-staging.result == 'success' &&
      needs.check-staging.outputs.configured == 'true'
    environment:
      name: staging
    steps:
      - name: Trigger Render Staging Deployment
        env:
          STAGING_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
        run: |
          # Same image that production will receive: built once, promoted by tag.
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/drch_backend:sha-${GITHUB_SHA:0:7}"
          SEP="?"; case "$STAGING_HOOK" in *\?*) SEP="&";; esac
          echo "Triggering Render staging deployment of $IMAGE..."
          response=$(curl -s -L -o /dev/null -w "%{http_code}" -X POST "${STAGING_HOOK}${SEP}imgURL=${IMAGE}")
          if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
            echo "Dispatched staging deployment (HTTP $response)."
          else
            echo "::error::Render staging hook responded with HTTP $response. Please check secret RENDER_STAGING_DEPLOY_HOOK."
            exit 1
          fi

  smoke:
    name: Staging Smoke / Live SHA Verification
    needs: [publish-backend, check-staging, deploy-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    if: |
      always() &&
      needs.deploy-staging.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Smoke Test Dependencies
        run: |
          pip install httpx pyotp

      - name: Wait until this commit is live on staging
        id: wait_live
        env:
          STAGING_URL: ${{ secrets.STAGING_BACKEND_URL }}
        run: |
          # Normalize URL (strip trailing slashes and /api/v1 if included)
          API_URL="${STAGING_URL%/}"
          API_URL="${API_URL%/api/v1}"
          echo "target_url=$API_URL" >> "$GITHUB_OUTPUT"

          COMMIT_SHA="${{ needs.publish-backend.outputs.version }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          echo "Waiting for live commit $COMMIT_SHA ($SHORT_SHA) on staging..."

          v="none"
          for i in $(seq 1 60); do
            HTTP_CODE=$(curl -s -L -o out.json -w "%{http_code}" --max-time 15 "$API_URL/api/v1/health" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              v=$(jq -r .version out.json 2>/dev/null || echo "unknown")
              echo "Polling attempt $i/60: HTTP 200, version '$v'"
              if [ "$v" = "$COMMIT_SHA" ] || [ "$v" = "$SHORT_SHA" ]; then
                echo "Deployed build is live on staging."
                exit 0
              fi
            else
              echo "Polling attempt $i/60: got HTTP $HTTP_CODE"
            fi
            sleep 10
          done

          echo "::error::Build $COMMIT_SHA not live on staging after 10 minutes (last reported version: '$v')."
          exit 1

      - name: Run Staging Smoke Test
        env:
          API_URL: ${{ steps.wait_live.outputs.target_url }}
          SMOKE_STAFF_EMAIL: ${{ secrets.SMOKE_STAFF_EMAIL }}
          SMOKE_STAFF_PASSWORD: ${{ secrets.SMOKE_STAFF_PASSWORD }}
          SMOKE_STAFF_TOTP_SECRET: ${{ secrets.SMOKE_STAFF_TOTP_SECRET }}
        run: |
          python scripts/smoke.py --base-url "$API_URL"

  # ============================================================================
  # 4. Production Deployment (Vercel, Render backend and Render AI run in parallel)
  # ============================================================================
  # Each deploy job waits only for what it actually deploys: Vercel builds the frontend itself
  # (it does not use the GHCR image) and starts immediately; Render jobs wait for their own image.
  # Secrets cannot be read in a job-level `if`, so this job reports which deploy
  # hooks are configured. Deploy jobs gate on it, so a missing hook shows the job
  # as "Skipped" instead of a misleading green "Success".
  check-hooks:
    name: Check Deploy Hooks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [detect-changes]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.result == 'success' &&
      (needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.ai-workers == 'true' || github.event_name == 'workflow_dispatch')
    environment:
      name: production
    outputs:
      vercel: ${{ steps.hooks.outputs.vercel }}
      render: ${{ steps.hooks.outputs.render }}
      render_ai: ${{ steps.hooks.outputs.render_ai }}
      prod_url: ${{ steps.hooks.outputs.prod_url }}
    steps:
      - name: Detect configured hooks
        id: hooks
        env:
          VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          RENDER_AI_HOOK: ${{ secrets.RENDER_AI_DEPLOY_HOOK }}
          PROD_URL: ${{ secrets.PROD_BACKEND_URL }}
        run: |
          if [ -n "$VERCEL_HOOK" ]; then echo "vercel=true" >> "$GITHUB_OUTPUT"; else
            echo "vercel=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_DEPLOY_HOOK secret not set. Vercel deployment will be skipped."
          fi
          if [ -n "$RENDER_HOOK" ]; then echo "render=true" >> "$GITHUB_OUTPUT"; else
            echo "render=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RENDER_DEPLOY_HOOK secret not set. Render deployment will be skipped."
          fi
          if [ -n "$RENDER_AI_HOOK" ]; then echo "render_ai=true" >> "$GITHUB_OUTPUT"; else
            echo "render_ai=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RENDER_AI_DEPLOY_HOOK secret not set. AI triage deployment (drch-ai-triage) will be skipped."
          fi
          if [ -n "$PROD_URL" ]; then echo "prod_url=true" >> "$GITHUB_OUTPUT"; else
            echo "prod_url=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PROD_BACKEND_URL secret not set. Production live-commit verification will be skipped."
          fi

  deploy-vercel:
    name: Deploy Frontend / Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes, check-hooks]
    if: |
      always() &&
      needs.check-hooks.result == 'success' &&
      needs.check-hooks.outputs.vercel == 'true' &&
      (needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch')
    environment:
      name: production
    steps:
      - name: Trigger Vercel Production Deployment
        env:
          VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          echo "🚀 Triggering Vercel frontend deployment..."
          response=$(curl -s -L -o /dev/null -w "%{http_code}" -X POST "$VERCEL_HOOK")
          if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
            echo "✅ Successfully dispatched Vercel build (HTTP $response)."
          else
            echo "::error::Vercel hook responded with HTTP $response. Please check secret VERCEL_DEPLOY_HOOK."
            exit 1
          fi

  deploy-render:
    name: Deploy Backend / Render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes, check-hooks, publish-backend, deploy-staging, smoke]
    # Staging smoke must have passed. "Skipped" is accepted only when staging was
    # skipped too (not configured); a failed staging deploy or smoke blocks production.
    if: |
      always() &&
      needs.check-hooks.result == 'success' &&
      needs.check-hooks.outputs.render == 'true' &&
      needs.publish-backend.result == 'success' &&
      (needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.smoke.result == 'success' || (needs.smoke.result == 'skipped' && needs.deploy-staging.result == 'skipped'))
    environment:
      name: production
    steps:
      - name: Trigger Render Production Deployment
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          # Pin the exact image built for this commit. A bare hook may redeploy a
          # cached ":latest", leaving the old build (version "dev") running.
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/drch_backend:sha-${GITHUB_SHA:0:7}"
          SEP="?"; case "$RENDER_HOOK" in *\?*) SEP="&";; esac
          echo "🚀 Triggering Render backend deployment of $IMAGE..."
          response=$(curl -s -L -o /dev/null -w "%{http_code}" -X POST "${RENDER_HOOK}${SEP}imgURL=${IMAGE}")
          if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
            echo "✅ Successfully dispatched Render deployment (HTTP $response)."
          else
            echo "::error::Render hook responded with HTTP $response. Please check secret RENDER_DEPLOY_HOOK."
            exit 1
          fi

      - name: Verify production is running this commit
        if: ${{ needs.check-hooks.outputs.prod_url == 'true' }}
        env:
          BACKEND_URL: ${{ secrets.PROD_BACKEND_URL }}
        run: |
          API_URL="${BACKEND_URL%/}"
          API_URL="${API_URL%/api/v1}"
          COMMIT_SHA="${{ needs.publish-backend.outputs.version }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          echo "Waiting for commit $SHORT_SHA to be live on production..."
          v="none"
          for i in $(seq 1 60); do
            HTTP_CODE=$(curl -s -L -o out.json -w "%{http_code}" --max-time 15 "$API_URL/api/v1/health" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              v=$(jq -r .version out.json 2>/dev/null || echo "unknown")
              echo "Attempt $i/60: HTTP 200, version '$v'"
              if [ "$v" = "$COMMIT_SHA" ] || [ "$v" = "$SHORT_SHA" ]; then
                echo "Production is running this commit."
                exit 0
              fi
            else
              echo "Attempt $i/60: got HTTP $HTTP_CODE"
            fi
            sleep 10
          done
          echo "::error::Commit $COMMIT_SHA not live on production after 10 minutes (last reported version: '$v')."
          exit 1

  deploy-render-ai:
    name: Deploy AI Triage / Render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes, check-hooks, publish-ai-workers]
    if: |
      always() &&
      needs.check-hooks.result == 'success' &&
      needs.check-hooks.outputs.render_ai == 'true' &&
      needs.publish-ai-workers.result == 'success' &&
      (needs.detect-changes.outputs.ai-workers == 'true' || github.event_name == 'workflow_dispatch')
    environment:
      name: production
    steps:
      - name: Trigger Render AI Triage Deployment
        env:
          RENDER_AI_HOOK: ${{ secrets.RENDER_AI_DEPLOY_HOOK }}
        run: |
          # Pin the exact image built for this commit (see deploy-render).
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/drch_ai_workers:sha-${GITHUB_SHA:0:7}"
          SEP="?"; case "$RENDER_AI_HOOK" in *\?*) SEP="&";; esac
          echo "🚀 Triggering Render AI triage deployment of $IMAGE..."
          response=$(curl -s -L -o /dev/null -w "%{http_code}" -X POST "${RENDER_AI_HOOK}${SEP}imgURL=${IMAGE}")
          if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
            echo "✅ Successfully dispatched Render AI triage deployment (HTTP $response)."
          else
            echo "::error::Render AI hook responded with HTTP $response. Please check secret RENDER_AI_DEPLOY_HOOK."
            exit 1
          fi
