name: Continuous Deployment (CD)

on:
  push:
    branches: [ "main" ]
    # S3-12 / S3-18: a release tag (vX.Y.Z or vX.Y.Z-rcN) builds every image from that exact commit and
    # tags it with the version, so a release can be deployed and rolled back by version. Tag builds do
    # not deploy and do not move `latest`; the release is deployed by pointing Render at the version
    # tag (docs/release-runbook.md section 4).
    tags: [ "v*.*.*" ]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  # Only the newest push to main deploys; older queued/running runs are cancelled.
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKER_BUILDKIT: 1

jobs:
  # ============================================================================
  # 0. Detect Changed Directories
  # ============================================================================
  detect-changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      ai-workers: ${{ steps.filter.outputs.ai-workers }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for file changes
        id: filter
        # Release tags build every image, so path filtering (which needs a base commit) is skipped.
        if: ${{ github.ref_type == 'branch' }}
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'docker-compose*.yml'
              - '.github/workflows/cd.yml'
            backend:
              - 'backend/**'
              - 'docker-compose*.yml'
              - 'render.yaml'
              - 'scripts/**'
              - '.github/workflows/cd.yml'
            ai-workers:
              - 'ai-workers/**'
              - 'docker-compose*.yml'
              - '.github/workflows/cd.yml'

  # ============================================================================
  # 0b. CI Gate: nothing is built or deployed unless CI passed on this exact commit
  # ============================================================================
  verify-ci:
    name: Verify CI Passed
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: read
    steps:
      - name: Only main and release tags may run CD
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ] && [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::CD runs only from main or a release tag (got $GITHUB_REF)."
            exit 1
          fi

      - name: Checkout repository
        if: ${{ github.ref_type == 'tag' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release tag must be on main
        if: ${{ github.ref_type == 'tag' }}
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main."
            exit 1
          fi

      - name: Wait for the CI quality gate on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GATE="Pipeline Status / Quality Gate"
          echo "Waiting for '$GATE' on $GITHUB_SHA..."
          for i in $(seq 1 80); do
            STATE=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
              --jq "[.check_runs[] | select(.name == \"$GATE\")] | sort_by(.started_at) | last | (.status + \":\" + (.conclusion // \"none\"))" 2>/dev/null || echo "")
            case "$STATE" in
              completed:success)
                echo "CI passed on this commit."
                exit 0 ;;
              completed:*)
                echo "::error::CI quality gate finished with '${STATE#completed:}' on $GITHUB_SHA. Not deploying."
                exit 1 ;;
              *)
                echo "Attempt $i/80: CI gate not finished yet (${STATE:-not found}), retrying in 30s..." ;;
            esac
            sleep 30
          done
          echo "::error::Timed out waiting for the CI quality gate on $GITHUB_SHA."
          exit 1

  # ============================================================================
  # 1. Build and Publish Frontend Container to GHCR (Only if frontend changed)
  # ============================================================================
  publish-frontend:
    name: Publish Container / Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes, verify-ci]
    if: ${{ needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/drch_frontend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      - name: Build and push verified container to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ============================================================================
  # 2. Build and Publish Backend Container to GHCR (Only if backend changed)
  # ============================================================================
  publish-backend:
    name: Publish Container / Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes, verify-ci]
    if: ${{ needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/drch_backend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      - name: Build and push verified container to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ============================================================================
  # 3. Build and Publish AI Workers Container to GHCR (Only if ai-workers changed)
  # ============================================================================
  publish-ai-workers:
    name: Publish Container / AI Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect-changes, verify-ci]
    if: ${{ needs.detect-changes.outputs.ai-workers == 'true' || github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/drch_ai_workers
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      - name: Build and push verified container to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./ai-workers
          file: ./ai-workers/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ai-workers
          cache-to: type=gha,mode=max,scope=ai-workers

  # ============================================================================
  # 4. Production Deployment (Vercel, Render backend and Render AI run in parallel)
  # ============================================================================
  # Secrets cannot be read in a job-level `if`, so this job reports which deploy
  # hooks are configured. Deploy jobs gate on it, so a missing hook shows the job
  # as "Skipped" instead of a misleading green "Success".
  check-hooks:
    name: Check Deploy Hooks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [detect-changes, verify-ci, publish-frontend, publish-backend, publish-ai-workers]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.ai-workers == 'true' || github.event_name == 'workflow_dispatch')
    environment:
      name: production
    outputs:
      vercel: ${{ steps.hooks.outputs.vercel }}
      render: ${{ steps.hooks.outputs.render }}
      render_ai: ${{ steps.hooks.outputs.render_ai }}
      backend_url: ${{ steps.hooks.outputs.backend_url }}
    steps:
      - name: Detect configured hooks
        id: hooks
        env:
          VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          RENDER_AI_HOOK: ${{ secrets.RENDER_AI_DEPLOY_HOOK }}
          BACKEND_URL: ${{ secrets.PROD_BACKEND_URL }}
        run: |
          if [ -n "$VERCEL_HOOK" ]; then echo "vercel=true" >> "$GITHUB_OUTPUT"; else
            echo "vercel=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_DEPLOY_HOOK secret not set. Vercel deployment will be skipped."
          fi
          if [ -n "$RENDER_HOOK" ]; then echo "render=true" >> "$GITHUB_OUTPUT"; else
            echo "render=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RENDER_DEPLOY_HOOK secret not set. Render deployment will be skipped."
          fi
          if [ -n "$RENDER_AI_HOOK" ]; then echo "render_ai=true" >> "$GITHUB_OUTPUT"; else
            echo "render_ai=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RENDER_AI_DEPLOY_HOOK secret not set. AI triage deployment (drch-ai-triage) will be skipped."
          fi
          if [ -n "$BACKEND_URL" ]; then echo "backend_url=true" >> "$GITHUB_OUTPUT"; else
            echo "backend_url=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PROD_BACKEND_URL secret not set. Staging smoke will be skipped."
          fi

  deploy-vercel:
    name: Deploy Frontend / Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes, check-hooks]
    if: |
      always() &&
      needs.check-hooks.result == 'success' &&
      needs.check-hooks.outputs.vercel == 'true' &&
      (needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch')
    environment:
      name: production
    steps:
      - name: Trigger Vercel Production Deployment
        env:
          VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          echo "🚀 Triggering Vercel frontend deployment..."
          response=$(curl -s -L -o /dev/null -w "%{http_code}" -X POST "$VERCEL_HOOK")
          if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
            echo "✅ Successfully dispatched Vercel build (HTTP $response)."
          else
            echo "::error::Vercel hook responded with HTTP $response. Please check secret VERCEL_DEPLOY_HOOK."
            exit 1
          fi

  deploy-render:
    name: Deploy Backend / Render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes, check-hooks]
    if: |
      always() &&
      needs.check-hooks.result == 'success' &&
      needs.check-hooks.outputs.render == 'true' &&
      (needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch')
    environment:
      name: production
    steps:
      - name: Trigger Render Production Deployment
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          # Pin the exact image built for this commit. A bare hook may redeploy a
          # cached ":latest", leaving the old build (version "dev") running.
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/drch_backend:sha-${GITHUB_SHA:0:7}"
          SEP="?"; case "$RENDER_HOOK" in *\?*) SEP="&";; esac
          echo "🚀 Triggering Render backend deployment of $IMAGE..."
          response=$(curl -s -L -o /dev/null -w "%{http_code}" -X POST "${RENDER_HOOK}${SEP}imgURL=${IMAGE}")
          if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
            echo "✅ Successfully dispatched Render deployment (HTTP $response)."
          else
            echo "::error::Render hook responded with HTTP $response. Please check secret RENDER_DEPLOY_HOOK."
            exit 1
          fi

      - name: Trigger Render AI Triage Deployment (AI Workers Only)
        if: ${{ needs.detect-changes.outputs.ai-workers == 'true' || github.event_name == 'workflow_dispatch' }}
        env:
          RENDER_AI_HOOK: ${{ secrets.RENDER_AI_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_AI_HOOK" ]; then
            echo "🚀 Triggering Render AI triage deployment..."
            response=$(curl -s -L -o /dev/null -w "%{http_code}" -X POST "$RENDER_AI_HOOK")
            if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
              echo "✅ Successfully dispatched Render AI triage deployment (HTTP $response)."
            else
              echo "⚠️ Render AI hook responded with HTTP $response. Please check secret RENDER_AI_DEPLOY_HOOK."
            fi
          else
            echo "ℹ️ RENDER_AI_DEPLOY_HOOK secret not set. Skipping AI triage deployment (drch-ai-triage in render.yaml)."
          fi

      - name: Verify Backend Health
        env:
          BACKEND_URL: ${{ secrets.PROD_BACKEND_URL }}
        run: |
          if [ -n "$BACKEND_URL" ]; then
            BACKEND_URL="${BACKEND_URL%/}"
            BACKEND_URL="${BACKEND_URL%/api/v1}"
            echo "Waiting for backend to complete deployment rollout at $BACKEND_URL..."
            sleep 10
            for i in $(seq 1 30); do
              HTTP_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 15 "$BACKEND_URL/health" || echo "000")
              if [ "$HTTP_STATUS" != "200" ]; then
                HTTP_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 15 "$BACKEND_URL/api/v1/health" || echo "000")
              fi
              if [ "$HTTP_STATUS" = "200" ]; then
                echo "✅ Backend healthcheck passed (HTTP 200)."
                exit 0
              fi
              echo "Polling $BACKEND_URL/health - attempt $i/30 (got HTTP $HTTP_STATUS), retrying in 5s..."
              sleep 5
            done
            echo "::error::Health check timed out or failed on $BACKEND_URL"
            exit 1
            echo "⚠️ Health check timed out or failed on $BACKEND_URL"
          else
            echo "ℹ️ PROD_BACKEND_URL secret not set. Skipping live health verification."
          fi

  deploy-render-ai:
    name: Deploy AI Triage / Render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes, check-hooks]
    if: |
      always() &&
      needs.check-hooks.result == 'success' &&
      needs.check-hooks.outputs.render_ai == 'true' &&
      (needs.detect-changes.outputs.ai-workers == 'true' || github.event_name == 'workflow_dispatch')
    environment:
      name: production
    steps:
      - name: Trigger Render AI Triage Deployment
        env:
          RENDER_AI_HOOK: ${{ secrets.RENDER_AI_DEPLOY_HOOK }}
        run: |
          # Pin the exact image built for this commit (see deploy-render).
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/drch_ai_workers:sha-${GITHUB_SHA:0:7}"
          SEP="?"; case "$RENDER_AI_HOOK" in *\?*) SEP="&";; esac
          echo "🚀 Triggering Render AI triage deployment of $IMAGE..."
          response=$(curl -s -L -o /dev/null -w "%{http_code}" -X POST "${RENDER_AI_HOOK}${SEP}imgURL=${IMAGE}")
          if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
            echo "✅ Successfully dispatched Render AI triage deployment (HTTP $response)."
          else
            echo "::error::Render AI hook responded with HTTP $response. Please check secret RENDER_AI_DEPLOY_HOOK."
            exit 1
          fi

  # ============================================================================
  # 5. Live Staging Smoke Gate (Live-SHA Verified)
  # ============================================================================
  smoke:
    name: Staging Smoke / Live SHA Verification
    needs: [detect-changes, check-hooks, deploy-render]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    if: |
      always() &&
      needs.deploy-render.result == 'success' &&
      needs.check-hooks.outputs.backend_url == 'true' &&
      github.ref == 'refs/heads/main' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Smoke Test Dependencies
        run: |
          pip install httpx pyotp

      - name: Wait until this commit is live
        id: wait_live
        env:
          STAGING_URL: ${{ secrets.PROD_BACKEND_URL }}
        run: |
          if [ -z "$STAGING_URL" ]; then
            echo "::notice::PROD_BACKEND_URL secret not set in GitHub Secrets. Skipping staging live version verification."
            echo "is_live=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Normalize URL (strip trailing slashes and /api/v1 if included)
          API_URL="${STAGING_URL%/}"
          API_URL="${API_URL%/api/v1}"
          echo "target_url=$API_URL" >> "$GITHUB_OUTPUT"

          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          echo "Waiting for live commit $COMMIT_SHA ($SHORT_SHA) on $API_URL..."

          for i in $(seq 1 36); do
            HTTP_CODE=$(curl -s -L -o out.json -w "%{http_code}" --max-time 15 "$API_URL/api/v1/health" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              v=$(jq -r .version out.json 2>/dev/null || echo "unknown")
              echo "Polling attempt $i/36: HTTP 200, version '$v'"
              if [ "$v" = "$COMMIT_SHA" ] || [ "$v" = "$SHORT_SHA" ]; then
                echo "✅ Deployed build is live on staging!"
                echo "is_live=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo "Polling attempt $i/36: got HTTP $HTTP_CODE"
            fi
            sleep 10
          done

          echo "::error::New build $COMMIT_SHA not live on $API_URL after 6 minutes (last reported version: '$v')."
          echo "is_live=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Run Staging Smoke Test
        if: ${{ steps.wait_live.outputs.is_live == 'true' }}
        env:
          API_URL: ${{ steps.wait_live.outputs.target_url }}
          SMOKE_STAFF_EMAIL: ${{ secrets.SMOKE_STAFF_EMAIL }}
          SMOKE_STAFF_PASSWORD: ${{ secrets.SMOKE_STAFF_PASSWORD }}
          SMOKE_STAFF_TOTP_SECRET: ${{ secrets.SMOKE_STAFF_TOTP_SECRET }}
        run: |
          python scripts/smoke.py --base-url "$API_URL"
